# Bootstrap-only vhost: served on :80 while we obtain the TLS certificate
# from Let's Encrypt for the first time. It only knows how to answer the ACME
# HTTP-01 challenge — anything else returns 404 because we don't want to
# accidentally serve traffic over plain HTTP for wapsell.com.
#
# Install:
#   cp /opt/wapsell/infra/nginx/wapsell.com.bootstrap.conf \
#      /etc/nginx/sites-available/wapsell.com
#   ln -sf /etc/nginx/sites-available/wapsell.com \
#          /etc/nginx/sites-enabled/wapsell.com
#   nginx -t && systemctl reload nginx
#
# Then run certbot --webroot (see docs/DEPLOY.md). Once the cert exists,
# overwrite this file with infra/nginx/wapsell.com.conf and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name wapsell.com www.wapsell.com;

    # Serve Let's Encrypt ACME tokens from the shared webroot dir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else: don't serve plain HTTP. Once the proper vhost replaces
    # this one it will redirect to HTTPS.
    location / {
        return 404;
    }
}
