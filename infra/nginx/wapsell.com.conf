# /etc/nginx/sites-available/wapsell.com
# Symlinked from /etc/nginx/sites-enabled/wapsell.com on the host.
#
# This vhost coexists with the other sites already served by the host nginx
# (Coolify, pipaas.com, the rest of the Hetzner box). It reverse-proxies
# wapsell.com -> 127.0.0.1:3010 where the wapsell-app Docker container listens.

# Map www subdomain to apex (canonical).
server {
    listen 80;
    listen [::]:80;
    server_name www.wapsell.com;
    return 301 https://wapsell.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapsell.com/privkey.pem;

    return 301 https://wapsell.com$request_uri;
}

# HTTP -> HTTPS for apex. Certbot writes the ACME challenge under /var/www/certbot
# which is shared with the cert-renew cron.
server {
    listen 80;
    listen [::]:80;
    server_name wapsell.com;

    # Webroot ACME challenge for certbot --webroot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS vhost.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wapsell.com;

    # TLS — same cert covers apex; www gets its own redirect server above.
    ssl_certificate /etc/letsencrypt/live/wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapsell.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WAPSELL_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS — 6 months, no preload until we are sure.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sane upload size — landing has no upload paths, this is belt-and-braces.
    client_max_body_size 1m;

    # Compress text assets. Next already serves pre-compressed where possible,
    # this catches the rest.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml image/svg+xml;
    gzip_proxied any;

    # Long-cache Next.js immutable assets — they're content-hashed.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else: pass to the Wapsell container.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
