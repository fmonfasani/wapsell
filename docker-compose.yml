# Wapsell landing — coexistence compose for the shared Hetzner VPS that also
# runs Coolify + Pipaas/Waseller. No nginx container in here; the host nginx
# proxies wapsell.com -> 127.0.0.1:${APP_PORT} (default 3010).
#
# Bring up on the VPS:
#   cd /opt/wapsell
#   docker compose up -d --build
#
# The image rebuilds in ~90s on cache-warm runs; first build takes ~3 min.

name: wapsell

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wapsell-app:latest
    container_name: wapsell-app
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bind to localhost ONLY. The host nginx does the public-facing TLS.
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    healthcheck:
      # Hits the Spanish landing — if Next is up and the i18n middleware
      # works, this returns 200. Avoids a separate /api/health route.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:3000/es', r => process.exit(r.statusCode >= 400 ? 1 : 0)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
