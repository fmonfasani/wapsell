# Wapsell landing — coexistence compose for the shared Hetzner VPS that also
# runs Coolify + Pipaas/Waseller. No nginx container in here; the host nginx
# proxies wapsell.com -> 127.0.0.1:${APP_PORT} (default 3010).
#
# Bring up on the VPS:
#   cd /opt/wapsell
#   docker compose up -d --build
#
# The image rebuilds in ~90s on cache-warm runs; first build takes ~3 min.

name: wapsell

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: wapsell-api:latest
    container_name: wapsell-api
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      # nginx api.wapsell.com proxies to 127.0.0.1:8500
      - "127.0.0.1:8500:8000"
    env_file:
      - .env.production
    environment:
      # DB lives on a dedicated data volume so rebuilds never shadow /app code.
      WAPSELL_DB_PATH: /data/wapsell.db
    volumes:
      - /tmp/wapsell-data:/tmp
      - wapsell-db:/data
    healthcheck:
      # The image has no curl; use python's urllib instead.
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time — must be the public API URL.
        NEXT_PUBLIC_API_URL: "https://api.wapsell.com"
    image: wapsell-app:latest
    container_name: wapsell-app
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy
    # Bind to localhost ONLY. The host nginx does the public-facing TLS.
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    healthcheck:
      # Hits the Spanish landing — if Next is up and the i18n middleware
      # works, this returns 200. Avoids a separate /api/health route.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:3000/es', r => process.exit(r.statusCode >= 400 ? 1 : 0)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  wapsell-db:
