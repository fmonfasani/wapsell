name: Deploy Wapsell to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Configure SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'KEYEOF'
          ${{ secrets.VPS_SSH_KEY }}
          KEYEOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📦 Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          echo "📦 Pulling latest code..."
          cd /opt/wapsell
          git fetch origin
          git pull origin main

          echo "🛑 Stopping current container..."
          docker compose down || true

          echo "🔨 Building Docker image..."
          docker compose build

          echo "✅ Starting container..."
          docker compose up -d

          echo "⏳ Waiting for health check (15s)..."
          sleep 15

          echo "🔍 Running health check..."
          if curl -sf http://localhost:3010/es > /dev/null; then
            echo "✨ Wapsell deployed successfully!"
          else
            echo "❌ Health check failed"
            docker compose logs app | tail -20
            exit 1
          fi
          EOF

      - name: 📢 Deployment success
        if: success()
        run: echo "✅ Wapsell is live at https://wapsell.com"

      - name: 📢 Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed - check logs above"
          exit 1
